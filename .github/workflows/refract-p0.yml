name: REFRACT-P0

on:
  pull_request:
    paths:
      - "experiments/refract-p0/**"
      - "legacy/archive/receipts/2026-03-30-outreach-receipt3.md"
      - ".github/workflows/refract-p0.yml"
  push:
    branches:
      - main
    paths:
      - "experiments/refract-p0/**"
      - "legacy/archive/receipts/2026-03-30-outreach-receipt3.md"
      - ".github/workflows/refract-p0.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/refract-p0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run REFRACT-P0 tests
        run: npm test
      - name: Run March 30 three-view comparison
        run: npm run demo
