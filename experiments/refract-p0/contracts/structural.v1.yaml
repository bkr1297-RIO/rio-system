contract_id: structural.v1
view_type: structural
observable_dimensions:
  - object_type
  - field_names
  - field_types
  - nesting
  - cardinality
must_preserve:
  - source_id
  - source_hash
  - original_field_names
  - original_values
  - provenance
may_change:
  - representation
  - ordering_of_reported_dimensions
  - derived_structural_summary
must_not_infer:
  - causal_claim
  - intent
  - authority
  - fact_promotion
  - hidden_motive
